name: Release

on:
  push:
    tags:
      # Matches bare (0.5.5) and prefixed (v0.5.5) tags alike.
      - '**[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts but skip creating a GitHub Release"
        type: boolean
        default: true
      version:
        description: "Version for dry-run artifact names (e.g. 0.5.5-test)"
        type: string
        default: "0.0.0-dry-run"
      vector_lsp_repo:
        description: "Repository to build vector-lsp from"
        type: string
        default: "yinyin333333/vector-lsp"
      vector_lsp_ref:
        description: "Ref of vector_lsp_repo to build"
        type: string
        default: "master"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            raw="$REF_NAME"
            tag="$REF_NAME"
          else
            raw="$INPUT_VERSION"
            tag="v${raw#v}"
          fi
          # The trigger accepts both tag forms; normalize so artifact names are
          # identical either way.
          version="${raw#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "raw=$raw version=$version tag=$tag"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout TXTeditor
        uses: actions/checkout@v6

      # inputs.* is empty on tag pushes, so the defaults must be repeated here.
      - name: Checkout vector-lsp
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.vector_lsp_repo || 'yinyin333333/vector-lsp' }}
          ref: ${{ inputs.vector_lsp_ref || 'master' }}
          path: vector-lsp

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            vector-lsp -> target
          cache-on-failure: true

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Frontend tests
        run: npm test

      # build.rs only syncs when schemas are absent and warns rather than
      # failing, so sync explicitly before building.
      - name: Sync d2rdoc schemas
        shell: pwsh
        working-directory: vector-lsp
        run: ./contrib/d2rdoc/sync-schemas.ps1

      - name: Build vector-lsp
        working-directory: vector-lsp
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Required vector-lsp smoke
        shell: pwsh
        run: |
          $root = (Resolve-Path -LiteralPath "vector-lsp").Path
          $exe  = (Resolve-Path -LiteralPath "vector-lsp\target\x86_64-pc-windows-msvc\release\vector-lsp.exe").Path
          npm run test:vector-lsp-smoke:required -- `
            --vector-lsp-exe "$exe" `
            --vector-lsp-root "$root" `
            --timeout-ms 120000

      # Portable zip only, so no bundler runs.
      - name: Build TXTeditor executable
        run: npm run tauri -- build --no-bundle

      - name: Stage portable zip
        shell: pwsh
        run: |
          $stage = New-Item -ItemType Directory -Force "staging\portable"
          # Keep the cargo binary name. Published releases ship txteditor.exe,
          # and renaming it gives the file a fresh SmartScreen identity.
          Copy-Item "src-tauri\target\release\txteditor.exe" $stage
          Copy-Item "vector-lsp\target\x86_64-pc-windows-msvc\release\vector-lsp.exe" $stage
          Copy-Item "vector-lsp\contrib" "$stage\contrib" -Recurse
          Compress-Archive -Path "$stage\*" `
            -DestinationPath "TXTeditor-v$env:VERSION-x86_64-pc-windows-msvc.zip" `
            -CompressionLevel Optimal
          Get-ChildItem $stage -Recurse | Select-Object -ExpandProperty FullName

      - uses: actions/upload-artifact@v6
        with:
          name: windows-portable
          path: TXTeditor-v${{ needs.version.outputs.version }}-x86_64-pc-windows-msvc.zip
          retention-days: 14

  linux:
    needs: version
    # Oldest image still shipping libwebkit2gtk-4.1-dev. Building on anything
    # newer raises the AppImage's glibc floor and breaks older distros.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout TXTeditor
        uses: actions/checkout@v6

      - name: Checkout vector-lsp
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.vector_lsp_repo || 'yinyin333333/vector-lsp' }}
          ref: ${{ inputs.vector_lsp_ref || 'master' }}
          path: vector-lsp

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            squashfs-tools

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            vector-lsp -> target
          cache-on-failure: true

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Sync d2rdoc schemas
        shell: pwsh
        working-directory: vector-lsp
        run: ./contrib/d2rdoc/sync-schemas.ps1

      - name: Build vector-lsp
        working-directory: vector-lsp
        run: cargo build --release

      - name: Required vector-lsp smoke
        run: |
          npm run test:vector-lsp-smoke:required -- \
            --vector-lsp-exe "$PWD/vector-lsp/target/release/vector-lsp" \
            --vector-lsp-root "$PWD/vector-lsp" \
            --timeout-ms 120000

      # tauri.conf.json targets nsis only. This CI-only overlay switches to
      # appimage and maps vector-lsp plus contrib into bundle.resources, which
      # linuxdeploy places in usr/lib/TXTeditor/. Paths are relative to
      # src-tauri/. Not committed; does not affect local dev builds.
      - name: Write Linux bundle config
        run: |
          cat > src-tauri/tauri.linux.ci.json <<'JSON'
          {
            "bundle": {
              "targets": ["appimage"],
              "resources": {
                "../vector-lsp/target/release/vector-lsp": "vector-lsp",
                "../vector-lsp/contrib": "contrib"
              }
            }
          }
          JSON
          cat src-tauri/tauri.linux.ci.json

      # NO_STRIP=1 is required: linuxdeploy's bundled strip cannot parse
      # .relr.dyn sections in current system libraries, and Tauri swallows its
      # stderr, so the only symptom would be "failed to run linuxdeploy".
      - name: Build AppImage
        env:
          NO_STRIP: "1"
        run: npm run tauri -- build --config src-tauri/tauri.linux.ci.json

      - name: Stage AppImage
        run: |
          set -euo pipefail
          shopt -s nullglob
          built=(src-tauri/target/release/bundle/appimage/*.AppImage)
          if [ "${#built[@]}" -ne 1 ]; then
            echo "expected 1 AppImage, found ${#built[@]}" >&2
            exit 1
          fi
          dest="TXTeditor-v${VERSION}-x86_64-unknown-linux-gnu.AppImage"
          cp "${built[0]}" "$dest"
          chmod +x "$dest"
          ls -la "$dest"

      # Guards the bug this workflow exists to keep fixed: if resources land
      # anywhere but usr/lib/TXTeditor/, resource_dir() cannot find vector-lsp.
      - name: Verify vector-lsp is inside the AppImage
        run: |
          set -euo pipefail
          dest="TXTeditor-v${VERSION}-x86_64-unknown-linux-gnu.AppImage"
          off=$("./$dest" --appimage-offset)
          unsquashfs -o "$off" -l "$dest" | grep -E 'usr/lib/TXTeditor/vector-lsp$'
          unsquashfs -o "$off" -l "$dest" | grep -cE 'usr/lib/TXTeditor/contrib/d2rdoc/3\.3/schema/.*\.js'

      - uses: actions/upload-artifact@v6
        with:
          name: linux-appimage
          path: TXTeditor-v${{ needs.version.outputs.version }}-x86_64-unknown-linux-gnu.AppImage
          retention-days: 14

  release:
    needs: [version, windows, linux]
    # Tag pushes always publish. Dispatches publish only when dry_run is off.
    if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TXTeditor $VERSION" \
            --generate-notes \
            artifacts/*
